name: Daily scrape (fallback)

# Manual fallback for the Vercel cron. The Vercel cron at 03:00 UTC is the
# active scheduler; this workflow only runs when triggered by hand from the
# Actions tab, and needs CRON_SECRET and SITE_URL set as repo Actions secrets.
# To switch schedulers, add a schedule block here and remove the Vercel cron.

on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape endpoint
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/scrape"
